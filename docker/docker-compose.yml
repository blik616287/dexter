services:
  warehouse:
    build:
      context: ..
      dockerfile: docker/Dockerfile.warehouse
    ports:
      - "8080:8080"
    volumes:
      - warehouse-data:/app/data
    command: ["--port", "8080", "--db", "/app/data/alerts.db"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  warehouse-data:
